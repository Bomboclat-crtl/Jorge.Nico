      <h3>Ejemplo Formulario con JS</h3> 
        <form id="formCalculadora" action="#" method="post">
          <label>Numero 1: </label>
          <input type="number" id="numero1" placeholder="ingrese un numero">
          <br>

          <br>
          <label>Operación</label>
          <select id="operacion">
            <option value="sum">Suma</option>
            <option value="rest">Resta</option>
            <option value="mul">Multiplicación</option>
            <option value="div">Disvisión</option>
          </select>
          <br><br>
          <button type="submit">Calcular</button>
          <button type="reset">Borrar</button>
        </form>
